services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: seo
      POSTGRES_DB: seo_machine
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - seo-machine-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo_machine?schema=public
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: production
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET}
      SMS_DEV_MODE: ${SMS_DEV_MODE:-false}
      GSC_CLIENT_ID: ${GSC_CLIENT_ID}
      GSC_CLIENT_SECRET: ${GSC_CLIENT_SECRET}
      GSC_REDIRECT_URI: ${GSC_REDIRECT_URI}
      GSC_SYNC_ENABLED: ${GSC_SYNC_ENABLED:-false}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY}
      KAVENEGAR_VERIFY_TEMPLATE: ${KAVENEGAR_VERIFY_TEMPLATE}
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo_machine?schema=public
      API_INTERNAL_URL: http://api:3001
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      AUTH_URL: ${APP_ORIGIN:-http://localhost:3000}
      AUTH_TRUST_HOST: 'true'
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  seo-machine-postgres:
